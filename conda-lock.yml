# Conda lockfile specification note
#
# To produce or update the platform-specific multi-arch lockfile:
#   conda-lock lock --file environment.yml --platform linux-64 --platform osx-arm64
#
# For strict reproducible production deployment, Docker builds can install directly
# from the generated lockfile:
#   micromamba create --yes --name exome --file conda-lock.yml
metadata:
  channels:
    - conda-forge
    - bioconda
  platforms:
    - linux-64
    - osx-arm64
package_spec:
  bwa: "0.7.17"
  bwa-mem2: "2.2.1"
  samtools: "1.19.2"
  gatk4: "4.5.0.0"
  fastqc: "0.12.1"
  fastp: "0.23.4"
  multiqc: "1.21"
  htslib: "1.19.1"
  seqtk: "1.4"
  picard: "3.1.1"
  openjdk: "17"
